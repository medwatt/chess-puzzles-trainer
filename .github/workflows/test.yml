name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: sudo apt install -y python3-tk

      - run: pip install .[dev]

      - run: ruff check src tests

      - run: git diff --check

      - run: python -m pytest tests/ -v
