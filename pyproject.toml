[project]
name = "chess-puzzles-trainer"
version = "1.1.1"
description = "Desktop chess puzzle trainer with engine analysis and play-vs-engine mode."
requires-python = ">=3.11"
dependencies = [
    "python-chess>=1.999",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.400",
]

[project.scripts]
chess-puzzles-trainer = "chess_puzzles.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_puzzles"]
include = ["assets/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
# Production code only. Tests use deliberate dynamic fakes (partial MainWindow
# objects built with __new__) that are exercised by pytest, not by a type
# checker; Ruff still checks them. untracked/ holds one-off experiments.
include = ["src"]
exclude = ["**/__pycache__", "untracked"]
# The floor declared in [project], not whatever interpreter happens to be local.
pythonVersion = "3.11"
